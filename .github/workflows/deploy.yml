name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r artifacts/app/flask/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest artifacts/app/flask/test_api.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t tourism-app -f artifacts/app/docker/Dockerfile artifacts/app

      - name: Health check container
        run: |
          docker run -d -p 5005:5005 --name tourism-test tourism-app
          sleep 5
          curl -f http://localhost:5005/health || exit 1
          docker stop tourism-test
